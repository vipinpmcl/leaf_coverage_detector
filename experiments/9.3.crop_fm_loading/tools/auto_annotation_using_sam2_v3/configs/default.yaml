device: cuda

input:
  original_name: original.jpg
  mask_name: mask.png
  skip_directories:
    - clusters_output

sam2:
  checkpoint: sam2_checkpoint/sam2.1_hiera_large.pt
  model_cfg: configs/sam2.1/sam2.1_hiera_l.yaml
  multimask_output: true
  mask_threshold: 0.0
  prompt_logit_abs_value: 10.0
  prompt_size: [256, 256]
  autocast_dtype: bfloat16

components:
  min_area: 1
  keep_largest_n: 0

refinement:
  min_prompt_overlap: 0.30
  remove_small_components: 100

polygon:
  epsilon_ratio: 0.002
  min_area: 5000

visualization:
  enabled: true
  alpha: 0.45

labelme:
  version: "5.11.3"
  label: leaf
  description: ""
  embed_image_data: true
