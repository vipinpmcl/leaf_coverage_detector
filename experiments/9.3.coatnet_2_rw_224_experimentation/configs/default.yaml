model:
  name: coatnet_2_rw_224
  foundation_checkpoint: "checkpoints/crop_fm1_coatNet2rw224.pth"
  pretrained: false
  out_indices: [1, 2, 3, 4]
  backbone_channels: [128, 256, 512, 1024]
  adapter_channels: [384, 256, 128, 96]
  decoder_channels: 192

data:
  image_dir: "data/images"
  mask_dir: "data/masks"
  image_size: 224
  val_ratio: 0.2
  seed: 42

training:
  batch_size: 2
  epochs: 35
  num_workers: 2
  head_lr: 1.0e-4
  backbone_lr: 1.0e-5
  weight_decay: 1.0e-4
  freeze_backbone: true
  amp: false
  output_dir: "runs/coatnet2_leaf"
  threshold: 0.6

normalization:
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]

segmentation:
  loss: bce_dice
  output_channels: 1
